name: Vibe Trading Lead Gen

on:
  schedule:
    # Runs once daily at 12:00 PM UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  run-lead-gen:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4  # <-- ADDED beautifulsoup4 HERE

    - name: Run Lead Generation Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Commit and push state file
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        touch proccessed_leads.json
        git add processed_leads.json
        git commit -m "Update processed leads state" -a || echo "No changes to commit"
        git push
