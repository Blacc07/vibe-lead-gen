name: Perp-Gap CEX Spot Lead Pipeline

on:
  schedule:
    # Runs every 2 hours, offset from the top of the hour.
    # 00:17, 02:17, 04:17, 06:17, 08:17, 10:17,
    # 12:17, 14:17, 16:17, 18:17, 20:17, 22:17 UTC
    - cron: "17 */2 * * *"

  # Allows manual triggering from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perp-gap-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt requests

      - name: Run perp-gap lead pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Optional. If not set, the script uses the public CoinGecko endpoint.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_HEADER: ${{ secrets.COINGECKO_API_HEADER }}

        run: python main.py

      - name: Commit state and master lists
        if: always() && !cancelled()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Reduce push conflicts if another run or manual commit changed the repo.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true

          for f in \
            processed_leads.json \
            master_spot_list.json \
            master_perp_list.json \
            review_leads.json \
            category_cursor.json
          do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          git diff --staged --quiet || git commit -m "Update perp-gap pipeline state"
          git push
